<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-slate-200/60">
  <div class="flex items-center justify-between px-5 py-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-brand-600 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-600/30">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <h1 class="text-xl font-black tracking-tight text-slate-800">Stock Manager</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadAllData()" aria-label="รีเฟรชข้อมูล" title="รีเฟรชข้อมูล" class="p-2.5 rounded-2xl bg-brand-50 text-brand-600 active:scale-90 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>
  </div>
  
  <div class="px-5 pb-3">
    <div class="relative">
      <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <input id="search-input" type="search" placeholder="ค้นหาสินค้า..."
             oninput="onSearch(); toggleClearBtn(this.value)"
             class="w-full px-4 py-3 pl-11 pr-10 rounded-2xl border border-slate-200 bg-slate-50 text-sm transition-all duration-200 outline-none focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10"/>
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500 p-1 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div id="tabs-scroll" class="flex gap-2 px-5 pb-4 overflow-x-auto no-scrollbar">
    <button id="tab-overview" class="tab-btn tab-priority tab-products active px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 whitespace-nowrap active:scale-95" onclick="switchTab('__OVERVIEW__',this)">รายการสินค้า</button>
    <button id="tab-update" class="tab-btn tab-priority tab-aging px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 whitespace-nowrap active:scale-95" onclick="switchTab('Aging',this)">Aging</button>
  </div>

<div id="subtabs-container" class="hidden px-5 pb-3 border-t border-slate-100 pt-3 flex-col sm:flex-row gap-3 sm:items-center justify-between">
    <div class="flex gap-2 overflow-x-auto no-scrollbar">
      <button class="subtab-btn px-3 py-1.5 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-500 active:scale-95 transition-all" onclick="switchSubTab('All',this)">All</button>
      <button class="subtab-btn px-3 py-1.5 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-500 active:scale-95 transition-all flex items-center gap-1" onclick="switchSubTab('Favorite',this)">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3h14a1 1 0 0 1 1 1v17l-7-3.5L6 21V4a1 1 0 0 1 1-1z"/>
        </svg>Favorite
      </button>
      <div id="sheet-subtabs" class="flex gap-2"></div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-brand-50 text-brand-600 active:scale-95 transition-all flex items-center gap-1 border border-brand-100 shadow-sm" onclick="openAddProductModal()">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        เพิ่มสินค้า
      </button>
      <button id="reorder-btn" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-500 active:scale-95 transition-all flex items-center gap-1 border border-slate-200 shadow-sm" onclick="toggleReorderMode()">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        จัดลำดับ
      </button>
    </div>
  </div>

<main id="scroll-container" class="flex-1 overflow-y-auto overscroll-none">

    <div class="w-6 h-6 border-2 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
  </div>
  
  <div class="px-5 py-6 pb-32">
    <div class="mb-4 flex items-center justify-between">
      <span id="stats-text" class="text-[10px] font-black text-slate-400 tracking-widest uppercase">กำลังโหลดข้อมูล...</span>
    </div>

    <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 text-slate-900">

    <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
      <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-300">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <p class="text-slate-400 font-bold">ไม่พบสินค้าที่คุณค้นหา</p>
    </div>
  </div>
