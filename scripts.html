<script>
var OVERVIEW_TAB = '__OVERVIEW__';
var AGING_TAB    = 'Aging';

var state = { 
  allData: {}, 
  current: OVERVIEW_TAB, 
  subTab: 'All',
  search: '',
  reorderMode: false
};

// ── Search & Clear Logic ─────────────────────────────────────────
function toggleClearBtn(val) {
  var btn = document.getElementById('clearSearchBtn');
  if (btn) btn.style.display = val.length > 0 ? 'block' : 'none';
}

function clearSearch() {
  var input = document.getElementById('search-input');
  input.value = '';
  toggleClearBtn('');
  state.search = '';
  renderList();
  input.focus();
}

// ── Favorite Logic (Sheet-backed) ───────────────────────────────

// Optimistic update: สลับค่า fav ใน state ทันที
function setFavInState(sn, ri, val) {
  var keys = Object.keys(state.allData);
  for (var k = 0; k < keys.length; k++) {
    var rows = state.allData[keys[k]] || [];
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].rowIndex === ri && rows[j].sheetName === sn) {
        rows[j].fav = val;
      }
    }
  }
}

// อัปเดต icon ดาวโดยไม่ re-render ทั้งหมด
function patchStarIcon(u, isFav) {
  var btn = document.getElementById('starbtn_' + u);
  if (!btn) return;
  var path = btn.querySelector('path');
  if (!path) return;
  if (isFav) {
    path.setAttribute('fill', '#f59e0b');
    path.setAttribute('stroke', '#f59e0b');
    btn.className = btn.className.replace('border-slate-200 bg-white', 'border-amber-200 bg-amber-50');
  } else {
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#cbd5e1');
    btn.className = btn.className.replace('border-amber-200 bg-amber-50', 'border-slate-200 bg-white');
  }
}


function handleFavoriteClick(sn, ri, currentFav, u) {
  // แปลง string "true"/"false" → boolean จริง (เพราะ bh() ส่งมาเป็น string)
  var isCurrent = currentFav === true || currentFav === 'true';
  var newFav = !isCurrent;

  // Optimistic: อัปเดต state + icon ทันที
  setFavInState(sn, ri, newFav);
  patchStarIcon(u, newFav);

  // ถ้าอยู่ใน Subtab Favorite ให้ re-render หลัง delay เล็กน้อย (animation เสร็จก่อน)
  if (state.current === AGING_TAB && state.subTab === 'Favorite') {
    setTimeout(renderList, 300);
  }

  google.script.run
    .withSuccessHandler(function(raw) {
      var res = JSON.parse(raw);
      if (!res.success) {
        // Rollback ถ้า server error
        setFavInState(sn, ri, isCurrent);
        patchStarIcon(u, isCurrent);
        showToast('ผิดพลาด: ' + res.error, true);
      }
    })
    .withFailureHandler(function(err) {
      setFavInState(sn, ri, isCurrent);
      patchStarIcon(u, isCurrent);
      showToast('ผิดพลาด: ' + (err.message || 'Unknown'), true);
    })
    .toggleFavorite(sn, ri, isCurrent);
}

// ── Sort Lots Logic ──────────────────────────────────────────────
function parseDateStr(str) {
  if (!str) return 0;
  var parts = str.split('/');
  if (parts.length >= 3) {
    var y = parseInt(parts[2], 10);
    if (y < 100) y += 2000;
    return new Date(y, parseInt(parts[1], 10)-1, parseInt(parts[0], 10)).getTime();
  }
  return new Date(str).getTime() || 0;
}

// เรียงวันหมดอายุเก่าสุดไปใหม่สุด ว่างไว้ท้าย — ใช้ตอน Save เท่านั้น
function sortLots(lots) {
  var hasVal = lots.filter(function(v) { return v !== ''; });
  var empty  = lots.filter(function(v) { return v === ''; });
  hasVal.sort(function(a, b) { return parseDateStr(a) - parseDateStr(b); });
  return hasVal.concat(empty);
}

// ── Performance-focused Rendering ──────────────────────────────────
var _renderTimer = null;
var CHUNK_SIZE = 15;

function renderList() {
  if (_renderTimer) clearTimeout(_renderTimer);
  
  var list = document.getElementById('product-list');
  var empty = document.getElementById('empty-state');
  var stats = document.getElementById('stats-text');
  var filtered = getFiltered();
  var total = getCurrentProducts().length;
  var overviewMode = state.current === OVERVIEW_TAB;

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'flex';
    stats.textContent = 'ไม่พบสินค้า';
    return;
  }
  
  empty.style.display = 'none';
  
  var label = overviewMode ? 'รายการสินค้า (รวม)' : ('อัปเดตสต็อก · ' + state.subTab);
  stats.textContent = label + ' · ' + filtered.length + ' / ' + total + ' รายการ';

  list.innerHTML = '';
  
  function renderChunk(start) {
    var end = Math.min(start + CHUNK_SIZE, filtered.length);
    var html = '';
    for (var i = start; i < end; i++) {
      html += overviewMode ? buildOverviewCard(filtered[i]) : buildCard(filtered[i]);
    }
    list.insertAdjacentHTML('beforeend', html);
    
    if (end < filtered.length) {
      _renderTimer = setTimeout(function() { renderChunk(end); }, 0);
    } else {
      applySelects();
    }
  }

  renderChunk(0);
}

}

  return '<div class="bg-white rounded-3xl border border-slate-200/60 shadow-premium overflow-hidden">' +

            '<div class="flex flex-wrap items-center gap-2 mt-2">' +

              '<label class="text-[10px] font-black text-brand-600 uppercase tracking-widest px-1">สต็อกปัจจุบัน (OH)</label>' +

            '</div>' +
            '<div class="flex gap-3">' +
              '<input type="number" inputmode="numeric" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white text-sm outline-none focus:border-brand-500 font-black text-lg text-brand-700" id="oh_'+u+'" value="'+ea(p.oh)+'"/>' +
              '<button class="px-6 py-3 rounded-2xl bg-brand-600 text-white text-sm font-bold shadow-md shadow-brand-500/20 active:scale-95 transition-all" id="ohbtn_'+u+'" onclick="'+bh('saveOh',[sn,p.rowIndex,u])+'">บันทึก OH</button>' +
            '</div>' +
          '</div>' +

          '<div class="space-y-4">' +
            '<div class="flex items-center justify-between">' +
              '<label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">จัดการ Lot สินค้า</label>' +
              '<span class="timestamp-label" id="lottime_'+u+'">'+(p.lotTime ? 'อัปเดต: '+p.lotTime : '')+'</span>' +
            '</div>' +
            '<div class="grid grid-cols-1 gap-3">'+lotPickerHtml+'</div>' +
            '<div class="flex gap-3 pt-2">' +
              '<button class="px-4 py-3 rounded-2xl bg-rose-50 text-rose-600 text-sm font-bold active:scale-95 transition-all flex-1" id="clearbtn_'+u+'" onclick="'+bh('clearLot',[sn,p.rowIndex,u])+'">ล้าง Lot</button>' +
              '<button class="px-4 py-3 rounded-2xl bg-brand-600 text-white text-sm font-bold shadow-md shadow-brand-500/20 active:scale-95 transition-all flex-[2]" id="savebtn_'+u+'" onclick="'+bh('saveLot',[sn,p.rowIndex,u])+'">บันทึก Lot</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

// ── Toast System ─────────────────────────────────────────────────
var _toastTimer = null;
function showToast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  var bg = isError ? 'bg-rose-600' : 'bg-slate-900';
  el.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] px-6 py-3.5 rounded-2xl text-white text-sm font-bold shadow-2xl transition-all duration-500 ' + bg + ' opacity-100 translate-y-0';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() {
    el.classList.replace('opacity-100', 'opacity-0');
    el.classList.replace('translate-y-0', 'translate-y-10');
  }, 3000);
}

// ── Logic ────────────────────────────────────────────────────────

function switchTab(name, btn) {
  state.current = name;
  state.search = '';
  document.getElementById('search-input').value = '';
  toggleClearBtn('');
  updatePlaceholder();
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var subContainer = document.getElementById('subtabs-container');
  if (name === AGING_TAB) {
    subContainer.classList.remove('hidden');
    subContainer.classList.add('flex');
    var targetSub = Array.from(subContainer.querySelectorAll('.subtab-btn')).find(function(b) {
      return b.textContent.trim() === state.subTab;
    });
    if (targetSub) switchSubTab(state.subTab, targetSub);
    else {
      var firstSub = subContainer.querySelector('.subtab-btn');
      if (firstSub) switchSubTab(firstSub.textContent.trim(), firstSub);
    }
  } else {
    subContainer.classList.remove('flex');
    subContainer.classList.add('hidden');
    renderList();
  }
  if (name === OVERVIEW_TAB) {
    state.reorderMode = false;
    var reorderBtn = document.getElementById('reorder-btn');
    if (reorderBtn) {
      reorderBtn.classList.replace('bg-brand-600', 'bg-slate-100');
      reorderBtn.classList.replace('text-white', 'text-slate-500');
    }
  }

  document.getElementById('scroll-container').scrollTop = 0;
}

function switchSubTab(name, btn) {
  state.subTab = name;
  document.querySelectorAll('.subtab-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  
  // ซ่อนปุ่มจัดลำดับถ้าไม่ใช่ tab 'All'
  var reorderBtn = document.getElementById('reorder-btn');
  if (reorderBtn) {
    if (name === 'All') reorderBtn.classList.remove('hidden');
    else {
      reorderBtn.classList.add('hidden');
      state.reorderMode = false;
      reorderBtn.classList.replace('bg-brand-600', 'bg-slate-100');
      reorderBtn.classList.replace('text-white', 'text-slate-500');
    }
  }

  document.getElementById('scroll-container').scrollTop = 0;
  renderList();
}

var _searchTimer = null;
function onSearch() {
  var val = document.getElementById('search-input').value;
  if (_searchTimer) clearTimeout(_searchTimer);
  _searchTimer = setTimeout(function() {
    state.search = val;
    renderList();
  }, 200);
}

function updatePlaceholder() {
  var el = document.getElementById('search-input');
  if (!el) return;
  if (state.current === OVERVIEW_TAB) el.placeholder = 'ค้นหาทุกสินค้า (ยกเว้น Aging)...';
  else el.placeholder = 'ค้นหาใน ' + state.subTab + '...';
}

// ── Data Management ──────────────────────────────────────────────

function getCurrentProducts() {
  if (state.current === AGING_TAB) {
    if (state.subTab === 'Favorite') {
  var outFav = [];
  var sheets = ['Oishi', 'Est', 'F&N'];
  for (var i = 0; i < sheets.length; i++) {
    var rows = state.allData[sheets[i]] || [];
    for (var j = 0; j < rows.length; j++) {
      var p = rows[j];
      if (!p.sheetName) p.sheetName = sheets[i];
      if (p.fav === true) outFav.push(p);
    }
  }
  return outFav;
}
    return state.allData[state.subTab] || [];
  }
  var out = [], targetSheets = ['Oishi', 'Est', 'F&N'];
  for (var i = 0; i < targetSheets.length; i++) {
    var sn = targetSheets[i];
    var rows = state.allData[sn] || [];
    for (var j = 0; j < rows.length; j++) {
      var p = rows[j];
      if (!p.sheetName) p.sheetName = sn;
      out.push(p);
    }
  }
  return out;
}

function norm(v) { return String(v || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

function matches(p, q) {
  var n = norm(q);
  if (!n) return true;
  var terms = n.split(' ');
  var hay = norm((p.sheetName||'') + ' ' + (p.name||'') + ' ' + (p.barcode||'') + ' ' + (p.size||'') + ' ' + (p.lot1||'') + ' ' + (p.lot2||'') + ' ' + (p.lot3||'') + ' ' + (p.lot4||'') + ' ' + (p.oh||''));
  return terms.every(function(term) { return hay.indexOf(term) !== -1; });
}

function getFiltered() {
  var products = getCurrentProducts();
  if (!norm(state.search)) return products;
  return products.filter(function(p) { return matches(p, state.search); });
}

// ── Utils ────────────────────────────────────────────────────────

function pad2(v) { return String(v).padStart(2, '0'); }
function ea(v) { return String(v || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
// แก้ฟังก์ชัน ja() ให้รองรับ boolean
function ja(v) {
  if (typeof v === 'boolean') return String(v); // true → "true", false → "false" โดยไม่ใส่ quotes
  return typeof v === 'number' ? String(v) : JSON.stringify(String(v == null ? '' : v));
}
function bh(name, args) {
  var p = args.map(ja);
  return ea(name + '(' + p.join(',') + ')');
}

function uid(sn, ri) { return String(sn || '').replace(/[^a-zA-Z0-9]/g, function(c) { return '_' + c.charCodeAt(0).toString(16); }) + '_' + ri; }

// ← เพิ่ม buildStarBtn ตรงนี้ ↓
function buildStarBtn(u, sn, ri, isFav) {
  var borderCls = isFav ? 'border-amber-200 bg-amber-50' : 'border-slate-200 bg-white';
  var onclick = bh('handleFavoriteClick', [sn, ri, isFav ? true : false, u]);
  
  // ไอคอน Bookmark แทนดาว — ทันสมัยกว่า
  var svgContent = isFav

    : '<path d="M5 3h14a1 1 0 0 1 1 1v17l-7-3.5L6 21V4a1 1 0 0 1 1-1z" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';

  return '<button id="starbtn_'+u+'" onclick="'+onclick+'" ' +

    'aria-label="Favorite">' +
    '<svg class="w-5 h-5" viewBox="0 0 24 24">'+svgContent+'</svg>' +
    '</button>';
}

// ── Lot picker ───────────────────────────────────────────────────

var _dayOpts = null, _monthOpts = null, _yearOpts = null, _yearBase = 0;

function getDayOpts() {
  if (_dayOpts) return _dayOpts;
  var h = '<option value="">วว</option>';
  for (var i = 1; i <= 31; i++) { var v = pad2(i); h += '<option value="'+v+'">'+v+'</option>'; }
  return (_dayOpts = h);
}
function getMonthOpts() {
  if (_monthOpts) return _monthOpts;
  var h = '<option value="">ดด</option>';
  for (var i = 1; i <= 12; i++) { var v = pad2(i); h += '<option value="'+v+'">'+v+'</option>'; }
  return (_monthOpts = h);
}
function getYearOpts() {
  var now = new Date().getFullYear();
  if (_yearOpts && _yearBase === now) return _yearOpts;
  _yearBase = now;
  var h = '<option value="">ค.ศ.</option>';
  for (var y = now - 2; y <= now + 5; y++) h += '<option value="'+y+'">'+y+'</option>';
  return (_yearOpts = h);
}

function parseLot(v) {
  var t = String(v || '').trim();
  if (!t) return null;
  var m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    var y = parseInt(m[3], 10);
    if (m[3].length === 2) y += 2000;
    if (y > 2400) y -= 543;
    return { day: pad2(m[1]), month: pad2(m[2]), year: String(y) };
  }
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return { day: pad2(m[3]), month: pad2(m[2]), year: m[1] };
  return null;
}

function buildLotPicker(u, n, val) {
  var p = parseLot(val) || {};
  var id = 'lot_' + u + '_' + n;
  return '<div class="space-y-1" id="'+id+'">' +
      '<div class="flex gap-1">' +
        '<select class="lot-select flex-1 min-w-0 px-1 py-2.5 text-sm font-semibold bg-white rounded-xl border border-slate-200 outline-none text-center" id="'+id+'_d" data-v="'+ea(p.day || '')+'">'+getDayOpts()+'</select>' +
        '<select class="lot-select flex-1 min-w-0 px-1 py-2.5 text-sm font-semibold bg-white rounded-xl border border-slate-200 outline-none text-center" id="'+id+'_m" data-v="'+ea(p.month || '')+'">'+getMonthOpts()+'</select>' +
        '<select class="lot-select flex-[1.4] min-w-0 px-1 py-2.5 text-sm font-semibold bg-white rounded-xl border border-slate-200 outline-none text-center" id="'+id+'_y" data-v="'+ea(p.year || '')+'">'+getYearOpts()+'</select>' +
      '</div>' +
    '</div>';
}

function applySelects() {
  requestAnimationFrame(function() {
    var sels = document.querySelectorAll('.lot-select[data-v]');
    for (var i = 0; i < sels.length; i++) {
      var sel = sels[i];
      sel.value = sel.getAttribute('data-v') || '';
      sel.removeAttribute('data-v');
    }
  });
}

function readLot(u, n) {
  var id = 'lot_' + u + '_' + n;
  var d = document.getElementById(id+'_d').value;
  var m = document.getElementById(id+'_m').value;
  var y = document.getElementById(id+'_y').value;
  if (!d && !m && !y) return '';
  if (!d || !m || !y) return null;
  return d + '/' + m + '/' + pad2(parseInt(y, 10) % 100);
}

function setAllLots(u, lots) {
  for (var i = 1; i <= 4; i++) {
    var p = parseLot(lots[i-1] || '') || {};
    var id = 'lot_' + u + '_' + i;
    document.getElementById(id+'_d').value = p.day || '';
    document.getElementById(id+'_m').value = p.month || '';
    document.getElementById(id+'_y').value = p.year || '';
  }
}

// ── State Management ─────────────────────────────────────────────

function getRow(sn, ri) {
  var rows = state.allData[sn] || [];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].rowIndex === ri) return rows[i];
  }
  return null;
}

function syncData(p, oldB, oldN) {
  var b = oldB || p.barcode, n = oldN || p.name;
  var names = Object.keys(state.allData);
  for (var i = 0; i < names.length; i++) {
    var sn = names[i];
    var rows = state.allData[sn];
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      if (r === p) continue;
      if (r.barcode === b && r.name === n) {
        Object.assign(r, { barcode: p.barcode, name: p.name, oh: p.oh, lot1: p.lot1, lot2: p.lot2, lot3: p.lot3, lot4: p.lot4, ohTime: p.ohTime, lotTime: p.lotTime });
      }
    }
  }
}

function updLots(sn, ri, lots, lotTime) {
  var r = getRow(sn, ri);
  if (r) {
    Object.assign(r, { lot1: lots[0] || '', lot2: lots[1] || '', lot3: lots[2] || '', lot4: lots[3] || '', lotTime: lotTime || '' });
    syncData(r);
  }
}

function updOh(sn, ri, oh, ohTime) {
  var r = getRow(sn, ri);
  if (r) { r.oh = oh || ''; r.ohTime = ohTime || ''; syncData(r); }
}

function updProd(sn, ri, sku, name) {
  var r = getRow(sn, ri);
  if (r) {
    var ob = r.barcode, on = r.name;
    Object.assign(r, { barcode: sku || '', name: name || '' });
    syncData(r, ob, on);
  }
}

function patchOh(u, oh, ohTime) {
  var el = document.getElementById('ovoh_' + u); if (el) el.textContent = oh || '0';
  var tel = document.getElementById('ohtime_' + u); if (tel) tel.textContent = ohTime ? 'อัปเดต: ' + ohTime : '';
  var ovtel = document.getElementById('ovohtime_' + u); if (ovtel) ovtel.textContent = ohTime || '';
}

function patchLotTime(u, lotTime) {
  var tel = document.getElementById('lottime_' + u);
  if (tel) tel.textContent = lotTime ? 'อัปเดต: ' + lotTime : '';
}

function patchProd(u, sku, name) {
  var t = document.getElementById('title_' + u); if (t) t.textContent = name || '-';
  var s = document.getElementById('skudisplay_' + u); if (s) s.textContent = sku || 'NO SKU';
}

function toggleEdit(u) {
  var panel = document.getElementById('edit_' + u);

  var isOpening = panel.classList.contains('hidden');

  document.querySelectorAll('.icon-btn').forEach(function(g) { g.classList.remove('active'); });
  if (isOpening) {
    panel.classList.remove('hidden');
    gear.classList.add('active');
    var ni = document.getElementById('name_' + u); if (ni) ni.focus();
  }
}

function cancelEdit(u, sku, name) {
  var si = document.getElementById('sku_' + u); if (si) si.value = sku || '';
  var ni = document.getElementById('name_' + u); if (ni) ni.value = name || '';

function saveProduct(sn, ri, u) {
  var btn = document.getElementById('editbtn_' + u);
  var sku  = document.getElementById('sku_'  + u).value.trim();
  var name = document.getElementById('name_' + u).value.trim();
  if (!name) { showToast('กรุณากรอกชื่อสินค้า', true); return; }

  var r = getRow(sn, ri);
  var prevSku = r ? r.barcode : '', prevName = r ? r.name : '';

  updProd(sn, ri, sku, name);
  patchProd(u, sku, name);
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(raw) {
      var res = JSON.parse(raw);
      btn.disabled = false;
      if (res.success) {
        showToast('บันทึกสำเร็จ ✓');
        setTimeout(function() { toggleEdit(u); btn.textContent = 'บันทึกข้อมูลสินค้า'; }, 500);
      } else {
        updProd(sn, ri, prevSku, prevName); patchProd(u, prevSku, prevName);
        showToast('ผิดพลาด: ' + res.error, true);
      }
    })
    .withFailureHandler(function(err) {
      updProd(sn, ri, prevSku, prevName); patchProd(u, prevSku, prevName);
      btn.disabled = false; btn.textContent = 'บันทึกข้อมูลสินค้า';
      showToast('ผิดพลาด: ' + (err.message || 'Unknown'), true);
    })
    .saveProductData(sn, ri, sku, name);
}

function saveLot(sn, ri, u) {
  var btn = document.getElementById('savebtn_' + u);

  // อ่านค่าจาก picker ทั้ง 4 ช่องตามลำดับ 1-4
  var lots = [];
  for (var i = 1; i <= 4; i++) {
    var v = readLot(u, i);
    if (v === null) { showToast('Lot '+i+' ไม่ถูกต้อง', true); return; }
    lots.push(v);
  }

  // ── เรียงวันก่อน Save: เก่าสุด → ใหม่สุด, ว่างไว้ท้าย ──
  lots = sortLots(lots);
  // ──────────────────────────────────────────────────────────

  var r = getRow(sn, ri);
  var prevLots = r ? [r.lot1, r.lot2, r.lot3, r.lot4] : ['', '', '', ''];
  var prevTime = r ? r.lotTime : '';

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(raw) {
      var res = JSON.parse(raw);
      btn.disabled = false; btn.textContent = 'บันทึก Lot';
      if (res.success) {
        updLots(sn, ri, lots, res.lotTime);
        patchLotTime(u, res.lotTime);
        showToast('บันทึก Lot สำเร็จ ✓');
        renderList(); // re-render เพื่อให้ picker แสดงลำดับใหม่ที่เรียงแล้ว
      } else {
        updLots(sn, ri, prevLots, prevTime);
        showToast('ผิดพลาด: ' + res.error, true);
      }
    })
    .withFailureHandler(function(err) {
      updLots(sn, ri, prevLots, prevTime);
      btn.disabled = false; btn.textContent = 'บันทึก Lot';
      showToast('ผิดพลาด: ' + (err.message || 'Unknown'), true);
    })
    .saveLotData(sn, ri, lots[0], lots[1], lots[2], lots[3]);
}

function saveOh(sn, ri, u) {

function clearLot(sn, ri, u) {

function toggleReorderMode() {
  state.reorderMode = !state.reorderMode;
  var btn = document.getElementById('reorder-btn');
  if (state.reorderMode) {
    btn.classList.replace('bg-slate-100', 'bg-brand-600');
    btn.classList.replace('text-slate-500', 'text-white');
  } else {
    btn.classList.replace('bg-brand-600', 'bg-slate-100');
    btn.classList.replace('text-white', 'text-slate-500');
  }
  renderList();
}

function moveProduct(u, dir) {
  if (!state.reorderMode || state.subTab !== 'All') return;
  var allItems = state.allData['All'] || [];
  var idx = -1;
  for (var i = 0; i < allItems.length; i++) {
    if (uid(allItems[i].sheetName, allItems[i].rowIndex) === u) { idx = i; break; }
  }
  
  if (idx === -1) return;
  var targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= allItems.length) return;

  var itemA = allItems[idx];
  var itemB = allItems[targetIdx];
  var skuA = itemA.barcode;
  var skuB = itemB.barcode;

  // Optimistic Swap
  allItems[idx] = itemB;
  allItems[targetIdx] = itemA;
  renderList();

  google.script.run
    .withSuccessHandler(function(raw) {
      var res = JSON.parse(raw);
      if (!res.success) {
        // Rollback
        var temp = allItems[idx];
        allItems[idx] = allItems[targetIdx];
        allItems[targetIdx] = temp;
        renderList();
        showToast('สลับลำดับผิดพลาด: ' + res.error, true);
      }
    })
    .withFailureHandler(function(err) {
      // Rollback
      var temp = allItems[idx];
      allItems[idx] = allItems[targetIdx];
      allItems[targetIdx] = temp;
      renderList();
      showToast('ผิดพลาด: ' + (err.message || 'Unknown'), true);
    })
    .reorderProduct(skuA, skuB);
}

    '<div class="col-span-full bg-rose-50 border border-rose-100 p-8 rounded-[32px] text-center space-y-4">' +
      '<div class="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto">' +
        '<svg class="w-8 h-8 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>' +
      '</div>' +
      '<p class="font-bold text-rose-600">' + msg + '</p>' +
      '<button onclick="loadAllData()" class="px-6 py-2 bg-rose-600 text-white rounded-xl font-bold text-sm">ลองใหม่อีกครั้ง</button>' +
    '</div>';
}

function initPullToRefresh() {
  var sc = document.getElementById('scroll-container');
  var bar = document.getElementById('ptr-bar');
  var startY = 0, diff = 0, pulling = false;

  sc.addEventListener('touchstart', function(e) {
    if (sc.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });

  sc.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    diff = Math.min(100, (e.touches[0].clientY - startY) * 0.4);
    if (diff > 0) bar.style.height = diff + 'px';
  }, { passive: true });

  sc.addEventListener('touchend', function() {
    if (diff > 60) { bar.style.height = '50px'; loadAllData(); setTimeout(function() { bar.style.height = '0'; }, 1000); }
    else bar.style.height = '0';
    pulling = false; diff = 0;
  });
}

window.addEventListener('DOMContentLoaded', function() {
  loadAllData();
  initPullToRefresh();
});
</script>
